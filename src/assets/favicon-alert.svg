<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="turtle, attention needed">
  <!-- Drawn for 16px, where a favicon actually lives. At tab size the
       silhouette is the only thing doing any work, so: pale limbs pushed clear
       of a dark shell, and a head plainly larger than the flippers — four equal
       blobs around a disc reads as a flower, not a turtle. -->
  <g fill="#8fd89f">
    <ellipse cx="32" cy="10" rx="10" ry="9.5"/>
    <ellipse cx="12" cy="20" rx="8.5" ry="5" transform="rotate(-42 12 20)"/>
    <ellipse cx="52" cy="20" rx="8.5" ry="5" transform="rotate(42 52 20)"/>
    <ellipse cx="12" cy="48" rx="8.5" ry="5" transform="rotate(42 12 48)"/>
    <ellipse cx="52" cy="48" rx="8.5" ry="5" transform="rotate(-42 52 48)"/>
    <path d="M32 61 L28 47 L36 47 Z"/>
  </g>
  <ellipse cx="32" cy="35" rx="19" ry="16" fill="#2b8850" stroke="#123f25" stroke-width="3"/>
  <path d="M32 24 L41 30.5 L37.5 41.5 L26.5 41.5 L23 30.5 Z" fill="#66c982"/>
  <!-- Attention badge. Amber is the colour `awaiting_approval` already wears in
       the UI, and the dark ring lifts it off the shell at 16px — where the dot
       is about four pixels across and is the only part of this that reads. -->
  <circle cx="51" cy="13" r="11.5" fill="#14472a"/>
  <circle cx="51" cy="13" r="8" fill="#e3b341"/>
</svg>
